# OpenBay: the whole system on one machine.
#
#   docker compose up --build        then open http://localhost:8080
#
#   browser ──> nginx (web) ──┬──> api-1 ──┐
#                             └──> api-2 ──┼──> PostgreSQL (records)
#   simulator (sensors, bots) ──> nginx    └──> Redis (spot locks, live updates)

x-api: &api
  build: ./backend
  restart: unless-stopped
  environment: &api-env
    DATABASE_URL: postgresql+asyncpg://openbay:openbay@db:5432/openbay
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-before-deploying}
    SENSOR_KEY: ${SENSOR_KEY:-dev-sensor-key}
    HOLD_SECONDS: ${HOLD_SECONDS:-120}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openbay
      POSTGRES_USER: openbay
      POSTGRES_PASSWORD: openbay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbay -d openbay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_NAME: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_NAME: api-2

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  # Fake sensors and a few bot drivers, so the lots change during a demo.
  # Turn it off with: docker compose stop simulator
  simulator:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "sim"]
    environment:
      API_URL: http://web
      SENSOR_KEY: ${SENSOR_KEY:-dev-sensor-key}
      SIM_INTERVAL: "2"
    depends_on:
      - web

volumes:
  pgdata:
