# nginx: serves the web app and load-balances the API across the replicas.

upstream openbay_api {
    least_conn;                       # send each request to the replica with the fewest open connections
    server api-1:8000 max_fails=2 fail_timeout=5s;
    server api-2:8000 max_fails=2 fail_timeout=5s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://openbay_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;   # if a replica is down, try the other one
        # Let the replica's own header through, so you can see which replica answered.
        add_header X-Load-Balancer nginx always;
    }

    location /ws/ {
        proxy_pass http://openbay_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
